name: Kukugya KNX Bridge
slug: kukugya_knx_bridge
description: Bridge Kukugya to a live KNX bus via Home Assistant WebSocket API.
version: "0.1.2"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
startup: services
boot: auto
init: false
homeassistant_api: true
hassio_api: false
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Kukugya bridge API
options:
  homeassistant_url: ws://supervisor/core/websocket
  bind_host: 0.0.0.0
  bind_port: 8099
  event_buffer_size: 1000
schema:
  homeassistant_url: str
  bind_host: str
  bind_port: int
  event_buffer_size: int
